name: AI Gurukul 2.0 - CI Quality Gates

on:
  push:
    branches: [main, ayurveda, 'phase_*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Lint, Typecheck, Test & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://localhost:27017/aigurukul_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test_jwt_access_secret_long_enough_32_bytes_min
      JWT_REFRESH_SECRET: test_jwt_refresh_secret_long_enough_32_bytes_min
      COOKIE_SECRET: test_cookie_secret_long_enough_32_bytes_min
      AI_PROVIDER: local
      EMBEDDING_PROVIDER: local
      VECTOR_STORE_PROVIDER: local
      STORAGE_PROVIDER: local

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Clean Dependency Installation
        run: npm ci

      - name: 🔍 ESLint Check
        run: npm run lint

      - name: 📐 TypeScript Typecheck (All 12 Packages)
        run: npm run typecheck

      - name: 🧪 Automated Vitest Test Suites
        run: npm test

      - name: 🏗️ Production Next.js & Package Build
        run: npm run build
