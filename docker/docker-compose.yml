services:
  mongodb:
    image: mongo:7.0
    container_name: aigurukul_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: aigurukul_dev
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: aigurukul_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
